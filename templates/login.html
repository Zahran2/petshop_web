<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login - Petshop Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-sm rounded-3xl shadow-md border border-stone-200 p-6 space-y-5">
    <div class="text-center space-y-1">
      <div class="text-4xl">🐾</div>
      <h1 class="text-xl font-bold text-stone-800">Petshop Login</h1>
      <p class="text-xs text-stone-500">Masukkan username dan PIN untuk masuk</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-xs font-semibold px-3.5 py-2.5 rounded-xl text-center">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">Username</label>
        <input type="text" name="username" required autocomplete="username"
               placeholder="admin atau kasir"
               class="w-full border border-stone-300 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:border-amber-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">PIN</label>
        <input type="password" name="pin" inputmode="numeric" required autocomplete="current-password"
               placeholder="••••"
               class="w-full border border-stone-300 rounded-xl px-3.5 py-3 text-base tracking-widest focus:outline-none focus:border-amber-500" />
      </div>

      <button type="submit" {{ 'disabled' if terkunci else '' }}
              class="w-full {{ 'bg-stone-400 cursor-not-allowed' if terkunci else 'bg-amber-600 hover:bg-amber-700 active:scale-[0.99]' }} text-white font-bold py-3 rounded-xl text-sm shadow">
        {{ 'TERKUNCI SEMENTARA' if terkunci else 'MASUK' }}
      </button>
    </form>
  </div>

</body>
</html>
