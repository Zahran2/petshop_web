<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login - Petshop Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-sm rounded-3xl shadow-md border border-stone-200 p-6 space-y-5">
    <div class="text-center space-y-1">
      <div class="text-4xl">🐾</div>
      <h1 class="text-xl font-bold text-stone-800">Petshop Login</h1>
      <p class="text-xs text-stone-500">Masukkan username dan PIN untuk masuk</p>
    </div>

    {% if error %}
    <div id="box-error" data-sisa-detik="{{ sisa_detik or 0 }}"
         class="bg-red-50 border border-red-200 text-red-700 text-xs font-semibold px-3.5 py-2.5 rounded-xl text-center">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">Username</label>
        <input type="text" name="username" required autocomplete="username"
               value="{{ username or '' }}"
               placeholder="admin atau kasir"
               class="w-full border border-stone-300 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:border-amber-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">PIN</label>
        <div class="relative">
          <input id="input-pin" type="password" name="pin" inputmode="numeric" required autocomplete="current-password"
                 {{ 'autofocus' if username else '' }}
                 placeholder="••••"
                 class="w-full border border-stone-300 rounded-xl pl-3.5 pr-16 py-3 text-base tracking-widest focus:outline-none focus:border-amber-500" />
          <button type="button" id="btn-toggle-pin" onclick="toggleLihatPin()"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-semibold text-stone-500 hover:text-amber-700 px-2 py-1 rounded-lg bg-stone-100">
            Lihat
          </button>
        </div>
      </div>

      <button type="submit"
              class="w-full bg-amber-600 hover:bg-amber-700 active:scale-[0.99] text-white font-bold py-3 rounded-xl text-sm shadow">
        MASUK
      </button>
    </form>
  </div>

  <script>
    function toggleLihatPin() {
      const inp = document.getElementById('input-pin');
      const btn = document.getElementById('btn-toggle-pin');
      const tersembunyi = inp.type === 'password';
      inp.type = tersembunyi ? 'text' : 'password';
      btn.textContent = tersembunyi ? 'Tutup' : 'Lihat';
      inp.focus();
    }

    (function mulaiCountdownBlokir() {
      const box = document.getElementById('box-error');
      if (!box) return;
      let sisa = Number(box.dataset.sisaDetik || 0);
      if (sisa <= 0) return;

      const timer = setInterval(() => {
        sisa -= 1;
        if (sisa <= 0) {
          clearInterval(timer);
          box.className = 'bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold px-3.5 py-2.5 rounded-xl text-center';
          box.textContent = 'Masa tunggu selesai. Silakan masukkan PIN kembali.';
          return;
        }
        const m = Math.floor(sisa / 60);
        const d = sisa % 60;
        const teksWaktu = m > 0 ? `${m} menit ${d} detik` : `${d} detik`;
        box.textContent = `Terlalu banyak percobaan gagal. Coba lagi dalam ${teksWaktu}.`;
      }, 1000);
    })();
  </script>

</body>
</html>
